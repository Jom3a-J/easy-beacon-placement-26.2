plugins {
	id 'net.fabricmc.fabric-loom'
}

loom {
	// Opens RenderType.create so the hologram can rebuild the see-through box type that 26.3
	// removed. See the file itself for why.
	accessWidenerPath = file('src/main/resources/easy_beacon_placement.accesswidener')
}

dependencies {
	// No `mappings` line: 26.x ships unobfuscated.
	minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
}

processResources {
	def props = [
		version    : project.version,
		mod_id     : rootProject.mod_id,
		mod_name   : rootProject.mod_name,
		mod_author : rootProject.mod_author,
		mod_license: rootProject.mod_license
	]
	props.each { k, v -> inputs.property(k, v) }

	filesMatching('fabric.mod.json') {
		expand props
	}
}

// Test scaffolding is kept out of this repository, which ships the mod. When it is present on a
// machine it brings its own build wiring with it; when it is not, this is a no-op.
if (file('harness.gradle').exists()) {
	apply from: 'harness.gradle'
}
