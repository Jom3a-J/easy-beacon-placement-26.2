// Paper/Spigot plugin. Deliberately separate from the mod modules: Paper is not a mod loader,
// it is a fork of the vanilla server exposing the Bukkit plugin API, so nothing here can share
// code with `common` — only the wire format is shared.
repositories {
	maven {
		name = 'PaperMC'
		url = 'https://repo.papermc.io/repository/maven-public/'
	}
}

dependencies {
	compileOnly "io.papermc.paper:paper-api:${rootProject.paper_api_version}"
}

processResources {
	def props = [
		version    : project.version,
		mod_id     : rootProject.mod_id,
		mod_name   : rootProject.mod_name,
		mod_author : rootProject.mod_author,
		mod_license: rootProject.mod_license
	]
	props.each { k, v -> inputs.property(k, v) }

	filesMatching('plugin.yml') {
		expand props
	}
}

// Test scaffolding is kept out of this repository, which ships the mod. When it is present on a
// machine it brings its own build wiring with it; when it is not, this is a no-op.
if (file('harness.gradle').exists()) {
	apply from: 'harness.gradle'
}
