# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Minecraft
# From 26.1 onwards Minecraft ships unobfuscated, so no `mappings` dependency is used anywhere.
minecraft_version=26.3

# Build toolchain.
# NOTE: this project deliberately does NOT use Architectury Loom. As of 1.17.491 it still
# hard-requires official Mojang mappings, which no longer exist for unobfuscated 26.x
# ("Failed to find official mojang mappings for 26.2"). Instead each platform uses its own
# native toolchain and shares one source directory - see the README.
fabric_loom_version=1.18.1
moddev_version=2.0.143

# Fabric (this jar also loads under Quilt Loader)
fabric_loader_version=0.19.5
fabric_api_version=0.160.5+26.3

# NeoForge. Unused while the mod targets 26.3: NeoForge has published nothing for 26.3, so the
# module is commented out of settings.gradle. Left here, pinned to the 26.2 line it was last built
# against, so re-enabling is one uncomment plus a bump to a real 26.3 build.
neoforge_version=26.2.0.37-beta

# Mod Properties
mod_id=easy_beacon_placement
mod_name=Easy Beacon Placement
mod_version=1.2.0
mod_author=Jom3a
mod_license=MIT
maven_group=com.jom3a.easybeacon

# Paper/Spigot plugin (separate Bukkit-API artifact, not a mod)
paper_api_version=26.3.build.4-alpha
