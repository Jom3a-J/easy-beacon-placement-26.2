# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        # The gametest source set is not wired into `check`, so it has to be named explicitly or
        # a test that no longer compiles goes unnoticed until someone runs it locally.
        run: ./gradlew build :fabric:compileGametestJava
      - name: neoforge harness
        # A headless dedicated server that drives the real server-side builder with a FakePlayer,
        # including the block-place event that land-claim mods hook. It needs no display and takes
        # well under a minute, so it belongs in CI rather than in someone's memory.
        run: ./gradlew :neoforge:runHarness
      - name: paper harness
        # The same idea for the plugin, against a real Paper server this downloads and checksums.
        # Running against current stable rather than a pinned build is deliberate: it is how
        # Paper-side breakage shows up here first rather than in someone's server console.
        run: ./gradlew :paper:runHarness
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          # Jars are produced per platform module; the root project builds nothing itself.
          # The Paper plugin is a separate download for server owners, so it ships too.
          path: |
            fabric/build/libs/
            neoforge/build/libs/
            paper/build/libs/
