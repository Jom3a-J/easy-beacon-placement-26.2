# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        # The unit tests run here, via `check`. The loader harnesses deliberately do not: they boot
        # real servers, and the Paper one downloads a server to do it, which is a lot of CI time
        # per push. They are run locally instead - see `./gradlew localCheck`.
        #
        # Their source sets are still compiled, because none of them is wired into `check` and a
        # harness that quietly stopped compiling would not be noticed until someone went to use it.
        run: >-
          ./gradlew build
          :fabric:compileGametestJava
          :neoforge:compileHarnessJava
          :paper:compileHarnessJava
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          # Jars are produced per platform module; the root project builds nothing itself.
          # The Paper plugin is a separate download for server owners, so it ships too.
          path: |
            fabric/build/libs/
            neoforge/build/libs/
            paper/build/libs/
