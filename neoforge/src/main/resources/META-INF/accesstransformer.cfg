# The NeoForge half of the Fabric access widener - see
# fabric/src/main/resources/easy_beacon_placement.accesswidener for why this is needed.
#
# 26.3 moved rendering onto the renderpearl backend and deleted the text-background pipelines.
# RenderTypes.textBackgroundSeeThrough() went with them, and it was the only stock render type
# that drew untextured POSITION_COLOR quads with no depth test - what the hologram uses to show
# obstructions buried in terrain. The replacement pipeline in EbpRenderTypes is built entirely
# from public API; the one piece vanilla keeps to itself is the call that wraps a RenderSetup
# into a RenderType.
public net.minecraft.client.renderer.rendertype.RenderType create(Ljava/lang/String;Lnet/minecraft/client/renderer/rendertype/RenderSetup;)Lnet/minecraft/client/renderer/rendertype/RenderType;
